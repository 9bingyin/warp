name: Build Docker Image

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "docker/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/docker.yml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      mihomo_version: ${{ steps.mihomo.outputs.version }}
      should_build: ${{ steps.compare.outputs.should_build }}
    steps:
      - name: Get latest mihomo version
        id: mihomo
        run: |
          VERSION=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name')
          if [ "$VERSION" = "null" ] || [ -z "$VERSION" ]; then
            echo "::error::Failed to fetch mihomo version"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "latest mihomo version: $VERSION"

      - name: Check if version already exists
        id: compare
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ steps.mihomo.outputs.version }}"
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "trigger=$EVENT, always build"
            exit 0
          fi

          # GHCR v2 API 需要先通过 token 交换获取 registry token
          TOKEN=$(curl -s -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://${{ env.REGISTRY }}/token?scope=repository:${IMAGE_NAME_LOWER}:pull" | jq -r '.token')

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://${{ env.REGISTRY }}/v2/${IMAGE_NAME_LOWER}/manifests/${VERSION}" \
            -H "Accept: application/vnd.oci.image.index.v1+json")

          if [ "$STATUS" = "200" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "version $VERSION already exists, skipping build"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "version $VERSION not found (status=$STATUS), will build"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            MIHOMO_VERSION=${{ needs.check.outputs.mihomo_version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:buildcache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [check, build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:latest \
            -t ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ needs.check.outputs.mihomo_version }} \
            $(printf '${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:latest
